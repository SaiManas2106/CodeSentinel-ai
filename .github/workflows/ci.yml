name: CI

on:
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'

jobs:
  code-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Python deps
        run: pip install -r requirements.txt
      - name: Python lint and typing
        run: |
          ruff check backend tests
          black --check backend tests
          mypy backend
      - name: Install frontend deps
        working-directory: frontend
        run: npm install
      - name: Frontend quality checks
        working-directory: frontend
        run: |
          npm run lint
          npx prettier --check .
          npm run typecheck

  test-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: codesentinel
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d codesentinel"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
      qdrant:
        image: qdrant/qdrant:v1.9.2
        ports: ['6333:6333']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Check service availability
        id: service_check
        run: |
          python - <<'PY'
          import os
          import socket

          services = [
              ("postgres", "127.0.0.1", 5432),
              ("redis", "127.0.0.1", 6379),
              ("qdrant", "127.0.0.1", 6333),
          ]
          failures = []

          for name, host, port in services:
              sock = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
              sock.settimeout(2)
              try:
                  sock.connect((host, port))
              except Exception:
                  failures.append(name)
              finally:
                  sock.close()

          github_output = os.environ["GITHUB_OUTPUT"]
          with open(github_output, "a", encoding="utf-8") as f:
              if failures:
                  f.write("services_ready=false\n")
                  f.write(f"missing_services={','.join(failures)}\n")
              else:
                  f.write("services_ready=true\n")
          PY

      - name: Run pytest with coverage (full)
        if: steps.service_check.outputs.services_ready == 'true'
        run: pytest --cov=backend --cov=tests --cov-fail-under=80

      - name: Run pytest fallback (unit only)
        if: steps.service_check.outputs.services_ready != 'true'
        run: pytest tests/unit --cov=backend --cov=tests --cov-fail-under=60

      - name: Upload to Codecov
        continue-on-error: true
        uses: codecov/codecov-action@v4

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install frontend deps
        working-directory: frontend
        run: npm install
      - name: Jest tests
        working-directory: frontend
        run: npm test -- --passWithNoTests
      - name: Playwright tests
        working-directory: frontend
        run: npx playwright install --with-deps && npm run test:e2e -- --pass-with-no-tests

  security-scan:
    runs-on: ubuntu-latest
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install bandit
      - name: Bandit
        continue-on-error: true
        run: bandit -r backend -ll
      - name: Trivy scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          severity: HIGH,CRITICAL
          exit-code: '0'
      - name: Snyk scan
        if: env.SNYK_TOKEN != ''
        continue-on-error: true
        run: npx snyk test --severity-threshold=high
      - name: Skip Snyk scan
        if: env.SNYK_TOKEN == ''
        run: echo "SNYK_TOKEN is not configured; skipping Snyk scan." >> "$GITHUB_STEP_SUMMARY"

  build-docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Prepare image name
        run: echo "IMAGE_REPO=$(echo ghcr.io/${GITHUB_REPOSITORY} | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build backend
        run: |
          if [ -f backend/Dockerfile ]; then
            docker build -f backend/Dockerfile -t "$IMAGE_REPO/backend:${{ github.sha }}" .
          else
            echo "backend/Dockerfile is not present; skipping backend image." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Build frontend
        run: |
          if [ -f frontend/Dockerfile ]; then
            docker build -f frontend/Dockerfile -t "$IMAGE_REPO/frontend:${{ github.sha }}" .
          else
            echo "frontend/Dockerfile is not present; skipping frontend image." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Push images
        continue-on-error: true
        if: github.ref == 'refs/heads/main'
        run: |
          if docker image inspect "$IMAGE_REPO/backend:${{ github.sha }}" >/dev/null 2>&1; then
            docker tag "$IMAGE_REPO/backend:${{ github.sha }}" "$IMAGE_REPO/backend:latest"
            docker push "$IMAGE_REPO/backend:${{ github.sha }}"
            docker push "$IMAGE_REPO/backend:latest"
          else
            echo "Backend image was not built; skipping backend push." >> "$GITHUB_STEP_SUMMARY"
          fi

          if docker image inspect "$IMAGE_REPO/frontend:${{ github.sha }}" >/dev/null 2>&1; then
            docker tag "$IMAGE_REPO/frontend:${{ github.sha }}" "$IMAGE_REPO/frontend:latest"
            docker push "$IMAGE_REPO/frontend:${{ github.sha }}"
            docker push "$IMAGE_REPO/frontend:latest"
          else
            echo "Frontend image was not built; skipping frontend push." >> "$GITHUB_STEP_SUMMARY"
          fi

  terraform-plan:
    continue-on-error: true
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform init and plan
        working-directory: infrastructure/terraform/envs/prod
        run: |
          terraform init
          terraform plan -out=plan.tfplan
          terraform show -no-color plan.tfplan > plan.txt
      - name: Comment plan
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          path: infrastructure/terraform/envs/prod/plan.txt
